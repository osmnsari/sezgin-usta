<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sezgin Usta</title>
  <meta name="description" content="Sezgin Usta'nın randevu defteri">
  <meta name="theme-color" content="#F5F0E6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sezgin Usta">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <main id="view" aria-live="polite"></main>
    <nav id="nav" aria-label="Ana menü">
      <button class="nav-btn" id="nav-day" data-action="go-day">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>
        <span>Randevular</span>
      </button>
      <button class="mic-btn" data-action="mic" aria-label="Sesle söyle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4M8 22h8"/></svg>
      </button>
      <button class="nav-btn" id="nav-cust" data-action="go-customers">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2M16 3.13a4 4 0 0 1 0 7.75M21 21v-2a4 4 0 0 0-3-3.85"/></svg>
        <span>Müşteriler</span>
      </button>
    </nav>
  </div>
  <div id="install-bar"></div>
  <div id="sheet-root"></div>
  <div id="toast" role="status"></div>
  <div id="welcome"></div>
  <noscript>Bu uygulama için JavaScript açık olmalı.</noscript>
  <script src="nlu.js"></script>
  <script src="app.js"></script>
</body>
</html>
